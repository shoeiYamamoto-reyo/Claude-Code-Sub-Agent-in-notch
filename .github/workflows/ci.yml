name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Linux (swift test)
    runs-on: ubuntu-24.04
    container: swift:6.1-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  macos:
    name: macOS (swift test + xcodebuild)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test package
        run: swift test
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build app
        run: |
          xcodebuild \
            -project NotchAgent.xcodeproj \
            -scheme NotchAgent \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Check bundled notch-hook
        run: |
          HOOK=build/Build/Products/Debug/NotchAgent.app/Contents/MacOS/notch-hook
          test -x "$HOOK"
          # アプリが起動していなくても、何も出力せず exit 0 で終わること（ADR-0001）。
          OUT=$(echo '{"session_id":"ci","hook_event_name":"Stop"}' | NOTCH_AGENT_SOCKET=/tmp/none.sock "$HOOK")
          test -z "$OUT"
      # Xcode の無い Mac でも試せるように、ビルドしたアプリを Artifacts に置く。
      # Apple Silicon では署名の無いアプリは起動できないので、アドホック署名（証明書なし）を付ける。
      - name: Package app
        run: |
          APP=build/Build/Products/Debug/NotchAgent.app
          codesign --force --deep --sign - "$APP"
          codesign --verify --verbose "$APP"
          ditto -c -k --keepParent "$APP" NotchAgent.zip
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: NotchAgent-${{ github.sha }}
          path: NotchAgent.zip
          retention-days: 14
